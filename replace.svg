<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" font-family="'Courier New', monospace" font-size="13">
  <!-- Background -->
  <rect width="860" height="600" fill="#0f1117"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold" letter-spacing="1">Web Request Nonce Replacement Sequence</text>

  <!-- Browser group box -->
  <rect x="368" y="38" width="468" height="522" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="602" y="572" text-anchor="middle" fill="#475569" font-size="11" letter-spacing="1">BROWSER</text>

  <!-- Dividing dotted line between Handler and Stack -->
  <line x1="580" y1="50" x2="580" y2="560" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Lifeline headers -->
  <!-- User -->
  <rect x="30" y="50" width="100" height="34" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="72" text-anchor="middle" fill="#38bdf8" font-weight="bold">User</text>

  <!-- Extension -->
  <rect x="190" y="50" width="120" height="34" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="250" y="72" text-anchor="middle" fill="#a78bfa" font-weight="bold">Extension</text>

  <!-- WebRequest Handler -->
  <rect x="378" y="50" width="160" height="34" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="458" y="72" text-anchor="middle" fill="#34d399" font-weight="bold">WebRequest Handler</text>

  <!-- Network Stack -->
  <rect x="620" y="50" width="130" height="34" rx="4" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
  <text x="685" y="72" text-anchor="middle" fill="#fb923c" font-weight="bold">Network Stack</text>

  <!-- Lifelines -->
  <line x1="80"  y1="84" x2="80"  y2="560" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="250" y1="84" x2="250" y2="560" stroke="#a78bfa" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="458" y1="84" x2="458" y2="560" stroke="#34d399" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="685" y1="84" x2="685" y2="560" stroke="#fb923c" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-ret" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arr-self" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Step 1: User initiates web request → Network Stack -->
  <line x1="80" y1="140" x2="678" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="378" y="133" text-anchor="middle" fill="#94a3b8" font-size="11">initiates web request</text>
  <text x="10" y="143" fill="#475569" font-size="10">[1]</text>

  <!-- Step 2: Network Stack creates request (internal) -->
  <rect x="610" y="168" width="150" height="26" rx="3" fill="#1c1a14" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="685" y="185" text-anchor="middle" fill="#fb923c" font-size="11">creates request</text>
  <text x="10" y="183" fill="#475569" font-size="10">[2]</text>

  <!-- Step 3: Network Stack sends onBeforeRequest → WebRequest Handler -->
  <line x1="685" y1="230" x2="465" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="575" y="222" text-anchor="middle" fill="#94a3b8" font-size="11">onBeforeRequest</text>
  <text x="10" y="233" fill="#475569" font-size="10">[3]</text>

  <!-- Step 4: Network Stack checks map (internal note) -->
  <rect x="610" y="258" width="150" height="26" rx="3" fill="#1c1a14" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="685" y="275" text-anchor="middle" fill="#fb923c" font-size="11">check map for URL entry</text>
  <text x="10" y="273" fill="#475569" font-size="10">[4]</text>

  <!-- Step 5: Network Stack self-call replaceHandler() -->
  <line x1="685" y1="345" x2="735" y2="345" stroke="#fb923c" stroke-width="1.5"/>
  <line x1="735" y1="345" x2="735" y2="380" stroke="#fb923c" stroke-width="1.5"/>
  <line x1="735" y1="380" x2="692" y2="380" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr-self)"/>
  <text x="676" y="338" text-anchor="middle" fill="#fb923c" font-size="11">replaceNonce(nonce)</text>
  <text x="10" y="362" fill="#475569" font-size="10">[5]</text>

</svg>
