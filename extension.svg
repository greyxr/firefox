<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" font-family="'Courier New', monospace" font-size="13">
  <!-- Background -->
  <rect width="820" height="500" fill="#0f1117"/>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold" letter-spacing="1">Autofill Extension  Sequence</text>

  <!-- Browser group box (behind lifeline headers) -->
  <rect x="408" y="38" width="398" height="410" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="607" y="465" text-anchor="middle" fill="#475569" font-size="11" letter-spacing="1">BROWSER</text>

  <!-- Dividing dotted line between Handler and Stack -->

  <!-- Lifeline headers -->
  <!-- User -->
  <rect x="30" y="50" width="110" height="34" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="85" y="72" text-anchor="middle" fill="#38bdf8" font-weight="bold">User</text>

  <!-- Extension -->
  <rect x="220" y="50" width="130" height="34" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="285" y="72" text-anchor="middle" fill="#a78bfa" font-weight="bold">Extension</text>

  <!-- WebRequest Handler -->
  <rect x="420" y="50" width="170" height="34" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="505" y="72" text-anchor="middle" fill="#34d399" font-weight="bold">WebRequest Handler</text>

  <!-- Network Stack -->
  <rect x="660" y="50" width="130" height="34" rx="4" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
  <text x="725" y="72" text-anchor="middle" fill="#fb923c" font-weight="bold">Network Stack</text>

  <!-- Lifelines (dashed vertical) -->
  <line x1="85"  y1="84" x2="85"  y2="530" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="285" y1="84" x2="285" y2="530" stroke="#a78bfa" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="505" y1="84" x2="505" y2="530" stroke="#34d399" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="725" y1="84" x2="725" y2="530" stroke="#fb923c" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>

  <!-- Helper: arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-ret" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Step 1: User initiates autofill → Extension -->
  <line x1="85" y1="140" x2="278" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="180" y="133" text-anchor="middle" fill="#94a3b8" font-size="11">initiates autofill</text>
  <text x="50" y="158" fill="#64748b" font-size="11">[1]</text>

  <!-- Step 2: Extension calls handleCredentialReplacement(password) → WebRequest Handler -->
  <line x1="285" y1="190" x2="498" y2="190" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="391" y="183" text-anchor="middle" fill="#94a3b8" font-size="11">handleCredentialReplacement(url, password)</text>
  <text x="248" y="208" fill="#64748b" font-size="11">[2]</text>

  <!-- Step 3: WebRequest Handler returns nonce → Extension -->
  <line x1="505" y1="240" x2="292" y2="240" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-ret)"/>
  <text x="391" y="233" text-anchor="middle" fill="#64748b" font-size="11">return nonce</text>
  <text x="468" y="258" fill="#64748b" font-size="11">[3]</text>

  <!-- Step 4: WebRequest Handler sends url/password/nonce → Network Stack -->
  <line x1="505" y1="300" x2="718" y2="300" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="610" y="288" text-anchor="middle" fill="#94a3b8" font-size="11">addCredential(url, password, nonce)</text>
  <text x="468" y="318" fill="#64748b" font-size="11">[4]</text>

  <!-- Step 5: Network Stack adds entry to map (internal note) -->
  <!-- activation box on network stack -->
  <!-- <rect x="718" y="330" width="14" height="50" fill="#fb923c" opacity="0.25" rx="2"/>
  <line x1="725" y1="340" x2="725" y2="370" stroke="#fb923c" stroke-width="1.5"/> -->
  <!-- note box -->
  <rect x="650" y="325" width="155" height="20" rx="3" fill="#1c1a14" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="727" y="339" text-anchor="middle" fill="#fb923c" font-size="11">add entry to map</text>
  <text x="614" y="340" fill="#64748b" font-size="11">[5]</text>

  <!-- Step 6: Extension returns nonce → User -->
  <line x1="285" y1="400" x2="92" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-ret)"/>
  <text x="185" y="393" text-anchor="middle" fill="#64748b" font-size="11">return nonce</text>
  <text x="248" y="418" fill="#64748b" font-size="11">[6]</text>

  <!-- Step row labels on right -->


</svg>
