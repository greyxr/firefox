<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" font-family="'Courier New', monospace" font-size="13">
  <!-- Background -->
  <rect width="820" height="500" fill="#0f1117"/>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold" letter-spacing="1">Nonce Replacement Sequence</text>

  <!-- Browser group box (behind lifeline headers) -->
  <rect x="408" y="38" width="398" height="410" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="607" y="465" text-anchor="middle" fill="#475569" font-size="11" letter-spacing="1">BROWSER</text>

  <!-- Dividing dotted line between Handler and Stack -->

  <!-- Lifeline headers -->
  <!-- User -->
  <rect x="30" y="50" width="110" height="34" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="85" y="72" text-anchor="middle" fill="#38bdf8" font-weight="bold">User</text>

  <!-- Extension -->
  <rect x="220" y="50" width="130" height="34" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="285" y="72" text-anchor="middle" fill="#a78bfa" font-weight="bold">Extension</text>

  <!-- WebRequest Handler -->
  <rect x="420" y="50" width="170" height="34" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="505" y="72" text-anchor="middle" fill="#34d399" font-weight="bold">WebRequest Handler</text>

  <!-- Network Stack -->
  <rect x="660" y="50" width="130" height="34" rx="4" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
  <text x="725" y="72" text-anchor="middle" fill="#fb923c" font-weight="bold">Network Stack</text>

  <!-- Lifelines (dashed vertical) -->
  <line x1="85"  y1="84" x2="85"  y2="530" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="285" y1="84" x2="285" y2="530" stroke="#a78bfa" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="505" y1="84" x2="505" y2="530" stroke="#34d399" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="725" y1="84" x2="725" y2="530" stroke="#fb923c" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>

  <!-- Helper: arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-ret" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arr-self" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"/>
    </marker>
  </defs>

    <!-- Step 1: User initiates web request → Network Stack -->
  <line x1="85" y1="140" x2="725" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="378" y="133" text-anchor="middle" fill="#94a3b8" font-size="11">user initiates login request</text>
  <text x="260" y="133" fill="#475569" font-size="10">[1]</text>

  <!-- Step 2: Network Stack creates request (internal) -->
  <rect x="660" y="168" width="125" height="26" rx="3" fill="#1c1a14" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="725" y="185" text-anchor="middle" fill="#fb923c" font-size="11">creates request</text>
  <text x="630" y="183" fill="#475569" font-size="10">[2]</text>

  <!-- Step 3: Network Stack sends onBeforeRequest → WebRequest Handler -->
  <line x1="725" y1="230" x2="505" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="575" y="222" text-anchor="middle" fill="#94a3b8" font-size="11">observers are notified of outgoing request</text>
  <text x="415" y="222" fill="#475569" font-size="10">[3]</text>

  <!-- Step 4: Network Stack checks map (internal note) -->
  <rect x="653" y="258" width="140" height="26" rx="3" fill="#1c1a14" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="725" y="275" text-anchor="middle" fill="#fb923c" font-size="11">check map for entry</text>
  <text x="625" y="273" fill="#475569" font-size="10">[4]</text>

  <!-- Step 5: Network Stack self-call replaceHandler() -->
  <line x1="725" y1="345" x2="775" y2="345" stroke="#fb923c" stroke-width="1.5"/>
  <line x1="775" y1="345" x2="775" y2="380" stroke="#fb923c" stroke-width="1.5"/>
  <line x1="775" y1="380" x2="732" y2="380" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr-self)"/>
  <text x="716" y="338" text-anchor="middle" fill="#fb923c" font-size="11">replaceNonce(nonce)</text>
  <text x="630" y="338" fill="#475569" font-size="10">[5]</text>

  <!-- Step row labels on right -->


</svg>
